<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Multi-Agent Legal Assistant</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-soft: #273548;
    --line: #334155;
    --ink: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --law: #818cf8;
    --tax: #fbbf24;
    --compliance: #34d399;
    --error: #f87171;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    padding: 1.1rem 1.5rem;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: .6rem;
  }
  header h1 {
    font-size: 1.15rem;
    margin: 0;
    font-weight: 700;
  }
  header .tag {
    color: var(--muted);
    font-size: .82rem;
  }
  main {
    flex: 1;
    max-width: 880px;
    width: 100%;
    margin: 0 auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 1rem 1.1rem;
  }
  .panel h2 {
    margin: 0 0 .6rem 0;
    font-size: .95rem;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .04em;
  }
  label {
    display: block;
    font-size: .8rem;
    color: var(--muted);
    margin-bottom: .3rem;
  }
  input, textarea {
    width: 100%;
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--ink);
    padding: .55rem .7rem;
    font-size: .92rem;
    font-family: inherit;
  }
  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea {
    resize: vertical;
    min-height: 84px;
  }
  .row {
    display: flex;
    gap: .6rem;
    margin-top: .7rem;
    align-items: center;
    flex-wrap: wrap;
  }
  button {
    background: var(--accent);
    color: #0f172a;
    border: none;
    border-radius: 6px;
    padding: .55rem 1.1rem;
    font-weight: 700;
    font-size: .9rem;
    cursor: pointer;
  }
  button:disabled {
    opacity: .55;
    cursor: not-allowed;
  }
  .examples {
    display: flex;
    flex-wrap: wrap;
    gap: .4rem;
    margin-top: .6rem;
  }
  .example-chip {
    background: var(--panel-soft);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: .28rem .7rem;
    font-size: .78rem;
    color: var(--muted);
    cursor: pointer;
  }
  .example-chip:hover {
    border-color: var(--accent);
    color: var(--ink);
  }
  #status {
    font-size: .82rem;
    color: var(--muted);
  }
  #status.error { color: var(--error); }
  #status.ok { color: var(--compliance); }

  .badges {
    display: flex;
    gap: .4rem;
    flex-wrap: wrap;
    margin-bottom: .8rem;
  }
  .badge {
    border-radius: 999px;
    padding: .2rem .65rem;
    font-size: .75rem;
    font-weight: 700;
    color: #0f172a;
  }
  .badge.law { background: var(--law); }
  .badge.tax { background: var(--tax); }
  .badge.compliance { background: var(--compliance); }

  #answer {
    font-size: .92rem;
    line-height: 1.6;
    white-space: normal;
  }
  #answer h3 {
    color: var(--accent);
    font-size: .95rem;
    margin: 1rem 0 .35rem 0;
    border-top: 1px solid var(--line);
    padding-top: .8rem;
  }
  #answer h3:first-child {
    margin-top: 0;
    border-top: none;
    padding-top: 0;
  }
  #answer hr { display: none; }
  #answer .disclaimer {
    color: var(--muted);
    font-size: .8rem;
    margin-top: .8rem;
    font-style: italic;
  }
  .spinner {
    width: 16px;
    height: 16px;
    border: 2px solid var(--line);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
    display: inline-block;
    vertical-align: middle;
    margin-right: .4rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta {
    font-size: .75rem;
    color: var(--muted);
    margin-top: .8rem;
    border-top: 1px solid var(--line);
    padding-top: .6rem;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: .75rem;
    padding: 1rem;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>⚖️ Multi-Agent Legal Assistant</h1>
  <span class="tag" id="health-tag">checking status…</span>
</header>

<main>
  <div class="panel">
    <h2>Ask the Assistant</h2>
    <label for="question">Your legal question</label>
    <textarea id="question" placeholder="e.g. What are the SEC and IRS penalties for offshore tax evasion?"></textarea>
    <div class="examples">
      <span class="example-chip" data-q="What is the statute of limitations for breach of contract?">Contract law</span>
      <span class="example-chip" data-q="What are the SEC and IRS penalties for offshore tax evasion?">Tax + SEC compliance</span>
      <span class="example-chip" data-q="Does GDPR apply to a US company processing EU customer data?">GDPR compliance</span>
    </div>
    <div class="row">
      <button id="askBtn">Ask</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="panel" id="resultPanel" style="display:none;">
    <h2>Response</h2>
    <div class="badges" id="badges"></div>
    <div id="answer"></div>
    <div class="meta" id="meta"></div>
  </div>
</main>

<footer>
  Day 12 — Cloud Infrastructure &amp; Deployment · Productionized multi-agent (Law / Tax / Compliance) ·
  <a href="/api/info">/api/info</a>
</footer>

<script>
const AGENT_API_KEY = 'my-secret-key-day12';
const questionInput = document.getElementById('question');
const askBtn = document.getElementById('askBtn');
const statusEl = document.getElementById('status');
const resultPanel = document.getElementById('resultPanel');
const answerEl = document.getElementById('answer');
const badgesEl = document.getElementById('badges');
const metaEl = document.getElementById('meta');
const healthTag = document.getElementById('health-tag');

document.querySelectorAll('.example-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    questionInput.value = chip.dataset.q;
  });
});

function renderAnswer(text) {
  const escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  const html = escaped
    .split(/\n\n---\n\n/)
    .map(block => {
      if (block.trim().startsWith('*This response was generated in mock mode')) {
        return `<div class="disclaimer">${block.replace(/\*/g, '')}</div>`;
      }
      return block.replace(/^## (.+)$/m, '<h3>$1</h3>');
    })
    .join('');
  answerEl.innerHTML = html.replace(/\n/g, '<br>');
}

function renderBadges(agents) {
  badgesEl.innerHTML = (agents || []).map(a =>
    `<span class="badge ${a}">${a.charAt(0).toUpperCase() + a.slice(1)}</span>`
  ).join('');
}

async function checkHealth() {
  try {
    const resp = await fetch('/health');
    const data = await resp.json();
    healthTag.textContent = `${data.environment} · llm: ${data.checks.llm} · up ${Math.round(data.uptime_seconds)}s`;
  } catch (e) {
    healthTag.textContent = 'unreachable';
  }
}
checkHealth();
setInterval(checkHealth, 30000);

askBtn.addEventListener('click', async () => {
  const question = questionInput.value.trim();

  if (!question) {
    statusEl.textContent = 'Please enter a question.';
    statusEl.className = 'error';
    return;
  }

  askBtn.disabled = true;
  statusEl.className = '';
  statusEl.innerHTML = '<span class="spinner"></span>Consulting agents…';
  resultPanel.style.display = 'none';

  try {
    const resp = await fetch('/ask', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-API-Key': AGENT_API_KEY,
      },
      body: JSON.stringify({ question }),
    });

    const data = await resp.json();

    if (!resp.ok) {
      const detail = typeof data.detail === 'string' ? data.detail : JSON.stringify(data.detail);
      statusEl.textContent = `Error ${resp.status}: ${detail}`;
      statusEl.className = 'error';
      return;
    }

    renderBadges(data.agents_consulted);
    renderAnswer(data.answer);
    metaEl.textContent = `model: ${data.model} · ${data.timestamp}`;
    resultPanel.style.display = 'block';
    statusEl.textContent = 'Done.';
    statusEl.className = 'ok';
  } catch (e) {
    statusEl.textContent = `Request failed: ${e}`;
    statusEl.className = 'error';
  } finally {
    askBtn.disabled = false;
  }
});

questionInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
    askBtn.click();
  }
});
</script>
</body>
</html>
